name: Build USC-CAM (iOS .ipa + Windows .exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail
          xcode-select -p
          sudo xcodebuild -license accept || true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/USC-CAM-main"
          brew install xcodegen
          xcodegen generate --spec project.yml
          ls -la
          test -f USBWebcam.xcodeproj/project.pbxproj
          xcodebuild -list -project USBWebcam.xcodeproj

      - name: Build app (unsigned)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/USC-CAM-main"
          xcodebuild -project USBWebcam.xcodeproj \
            -scheme USBWebcam \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .ipa
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/USC-CAM-main"
          APP=$(find "$PWD/build" -path '*/Build/Products/Release-iphoneos/*.app' -print -quit)
          echo "Detected app: ${APP:-<none>}"
          test -n "$APP"
          test -d "$APP"

          rm -rf Payload output
          mkdir -p Payload output
          cp -R "$APP" Payload/

          zip -qry output/USC-CAM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ github.workspace }}/USC-CAM-main/output/USC-CAM.ipa

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/USC-CAM-main"
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install opencv-python-headless numpy pyqt5 pyvirtualcam av pyinstaller

      - name: Add camera driver
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/USC-CAM-main"
          git clone --depth 1 https://github.com/schellingb/UnityCapture.git uc
          mkdir -p drv

          f64=$(find uc -type f -iname "UnityCaptureFilter64bit.dll" -not -path "uc/.git/*" | head -1)
          f32=$(find uc -type f -iname "UnityCaptureFilter32bit.dll" -not -path "uc/.git/*" | head -1)

          if [ -z "$f64" ] || [ -z "$f32" ]; then
            echo "UnityCapture DLLs not found. Repo files:"
            find uc -type f -not -path "uc/.git/*" | head -60
            exit 1
          fi

          cp -v "$f64" drv/HDCameraiPhone64.dll
          cp -v "$f32" drv/HDCameraiPhone32.dll

          lic=$(find uc -maxdepth 1 -iname "LICENSE*" | head -1)
          if [ -n "$lic" ]; then
            cp "$lic" drv/LICENSE-UnityCapture.txt
          fi

      - name: Build single-file EXE
        shell: pwsh
        run: |
          $proj = Join-Path $env:GITHUB_WORKSPACE "USC-CAM-main"
          Set-Location $proj
          pyinstaller --noconfirm --onefile --windowed `
            --name "USC-CAM" `
            --icon "$proj\desktop\icon.ico" `
            --add-data "$proj\desktop\icon.ico;." `
            --add-data "$proj\drv;driver" `
            --paths "$proj\desktop" `
            --collect-all pyvirtualcam `
            --collect-all av `
            "$proj\desktop\main.py"

      - name: Collect files
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/USC-CAM-main"
          mkdir -p dist/driver
          cp -v drv/* dist/driver/
          cp -v desktop/Install-HD-Camera.bat desktop/Uninstall-HD-Camera.bat dist/

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            ${{ github.workspace }}/USC-CAM-main/dist/USC-CAM.exe
            ${{ github.workspace }}/USC-CAM-main/dist/driver/
            ${{ github.workspace }}/USC-CAM-main/dist/Install-HD-Camera.bat
            ${{ github.workspace }}/USC-CAM-main/dist/Uninstall-HD-Camera.bat

  package-zip:
    name: Bundle final ZIP
    needs: [build-ios, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release/

      - name: Create ZIP
        shell: bash
        run: |
          set -euxo pipefail
          cd release
          zip -r ../USC-CAM-Package.zip .

      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: USC-CAM-Package
          path: USC-CAM-Package.zip
