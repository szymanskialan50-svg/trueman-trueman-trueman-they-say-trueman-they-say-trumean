name: Build USC-CAM (iOS .ipa + Windows .exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euxo pipefail
          xcode-select -p
          sudo xcodebuild -license accept || true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        working-directory: USC-CAM-main
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen
          xcodegen generate
          ls -la
          test -f USBWebcam.xcodeproj/project.pbxproj
          xcodebuild -list -project USBWebcam.xcodeproj

      - name: Build app (unsigned)
        working-directory: USC-CAM-main
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -project USBWebcam.xcodeproj \
                     -scheme USBWebcam \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package .ipa
        working-directory: USC-CAM-main
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$PWD/build" -path '*/Build/Products/Release-iphoneos/*.app' -print -quit)
          echo "Detected app: ${APP:-<none>}"
          test -n "$APP"
          test -d "$APP"

          rm -rf Payload output
          mkdir -p Payload output
          cp -R "$APP" Payload/

          zip -qry output/USC-CAM.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: USC-CAM-main/output/USC-CAM.ipa

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: USC-CAM-main
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install opencv-python-headless numpy pyqt5 pyvirtualcam av pyinstaller

      - name: Add camera driver
        shell: bash
        working-directory: USC-CAM-main
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/schellingb/UnityCapture.git uc
          mkdir -p drv

          f64=$(find uc -type f -iname "UnityCaptureFilter64bit.dll" -not -path "uc/.git/*" | head -1)
          f32=$(find uc -type f -iname "UnityCaptureFilter32bit.dll" -not -path "uc/.git/*" | head -1)

          if [ -z "$f64" ] || [ -z "$f32" ]; then
            echo "UnityCapture DLLs not found. Repo files:"
            find uc -type f -not -path "uc/.git/*" | head -60
            exit 1
          fi

          cp -v "$f64" drv/HDCameraiPhone64.dll
          cp -v "$f32" drv/HDCameraiPhone32.dll

          lic=$(find uc -maxdepth 1 -iname "LICENSE*" | head -1)
          if [ -n "$lic" ]; then
            cp "$lic" drv/LICENSE-UnityCapture.txt
          fi

      - name: Build single-file EXE
        shell: bash
        working-directory: USC-CAM-main
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euxo pipefail
          pyinstaller --noconfirm --onefile --windowed \
            --name "USC-CAM" \
            --icon desktop/icon.ico \
            --add-data "desktop/icon.ico;." \
            --add-data "drv;driver" \
            --paths desktop \
            --collect-all pyvirtualcam \
            --collect-all av \
            desktop/main.py

      - name: Collect files
        shell: bash
        working-directory: USC-CAM-main
        run: |
          set -euxo pipefail
          mkdir -p dist/driver
          cp -v drv/* dist/driver/
          cp -v desktop/Install-HD-Camera.bat desktop/Uninstall-HD-Camera.bat dist/

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            USC-CAM-main/dist/USC-CAM.exe
            USC-CAM-main/dist/driver/
            USC-CAM-main/dist/Install-HD-Camera.bat
            USC-CAM-main/dist/Uninstall-HD-Camera.bat

  package-zip:
    name: Bundle final ZIP
    needs: [build-ios, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release/

      - name: Create ZIP
        shell: bash
        run: |
          set -euxo pipefail
          cd release
          zip -r ../USC-CAM-Package.zip .

      - name: Upload Complete Bundle
        uses: actions/upload-artifact@v4
        with:
          name: USC-CAM-Package
          path: USC-CAM-Package.zip
